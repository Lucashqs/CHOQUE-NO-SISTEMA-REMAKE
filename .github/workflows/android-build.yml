
name: Choque no Sistema Remake - Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compilar APK e AAB
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar arquivos do jogo
        run: |
          mkdir -p app/src/main/assets

          cp teste_mundo1.html app/src/main/assets/

          for pasta in imagens js sons sprites; do
            if [ -d "$pasta" ]; then
              cp -R "$pasta" app/src/main/assets/
            fi
          done

          test -f app/src/main/assets/teste_mundo1.html

      - name: Compilar APK Debug
        run: gradle --no-daemon :app:assembleDebug

      - name: Restaurar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 nao configurado"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/remake-release.jks"

          test -s "$RUNNER_TEMP/remake-release.jks"

      - name: Compilar APK e AAB Release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/remake-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon \
            :app:assembleRelease \
            :app:bundleRelease

      - name: Publicar APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: Choque-Remake-APK-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar APK Release
        uses: actions/upload-artifact@v4
        with:
          name: Choque-Remake-APK-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar AAB Release
        uses: actions/upload-artifact@v4
        with:
          name: Choque-Remake-AAB-Release
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
