

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no"
    >

    <title>Choque no Sistema REMAKE</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #080e1b;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        body {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        /* ÁREA DO JOGO */

        
        /* ÁREA RESPONSIVA DA FASE 1 */

        .jogo {
            position: relative;
            container-type: inline-size;

            width: min(100vw, 177.7778vh);
            width: min(100vw, 177.7778dvh);

            max-width: none;
            aspect-ratio: 16 / 9;

            margin: 0 auto;
            overflow: hidden;
        }


        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #111;
            image-rendering: pixelated;
            touch-action: none;
        }

        
        /* BOTÃO DE PAUSE */

        #btnPause {
            position: absolute;
            top: 2%;
            right: 2%;
            z-index: 8;

            padding: 8px 14px;

            background: rgba(18, 60, 114, 0.9);
            color: white;

            border: 2px solid #38bdf8;
            border-radius: 10px;

            font-size: clamp(10px, 1.6cqw, 16px);
            font-weight: bold;

            cursor: pointer;
            touch-action: manipulation;
        }

        #btnPause:active {
            background: #1674bc;
        }


        /* VIDA DO HERÓI */

        
        /* HUD RESPONSIVA DO HERÓI */

        .hud {
            position: absolute;
            top: 2%;
            left: 2%;

            width: clamp(85px, 20cqw, 200px);

            text-align: left;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 8px;

            padding: clamp(4px, 0.8cqw, 10px);
            font-size: clamp(9px, 1.5cqw, 15px);

            pointer-events: none;
            z-index: 6;
        }


        .barra {
            height: 12px;
            background: #333;
            border: 1px solid white;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }

        #vidaPreenchimento {
            width: 100%;
            height: 100%;
            background: #22c55e;
        }

        /* CONTROLES SOBRE O ASFALTO */

        .controles {
            position: absolute;
            bottom: 5%;
            left: 0;
            width: 100%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 0 2%;
            margin: 0;
            gap: 6px;

            z-index: 5;
            pointer-events: none;
        }

        .grupo {
            display: flex;
            align-items: center;
            gap: clamp(3px, 0.8vw, 8px);
            min-width: 0;
        }

        .controles button {
            width: clamp(24px, 6.5cqw, 64px);
            height: clamp(24px, 6.5cqw, 60px);

            min-width: 0;
            padding: 0 3px;

            border: 2px solid #38bdf8;
            border-radius: 12px;

            background: rgba(24, 60, 105, 0.85);
            color: white;

            font-size: clamp(9px, 1.65vw, 18px);
            font-weight: bold;

            cursor: pointer;
            user-select: none;
            touch-action: none;
            pointer-events: auto;
        }

        .controles button:active {
            background: #168bdf;
            transform: scale(0.95);
        }

        
        /* ESCONDER BOTÕES DURANTE AS CUTSCENES */

        .controles.ocultos {
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }


        #pular {
            background: rgba(21, 94, 117, 0.9);
        }

        #ataque1 {
            background: rgba(154, 52, 18, 0.9);
            border-color: #fb923c;
        }

        #ataque2 {
            background: rgba(107, 33, 168, 0.9);
            border-color: #c084fc;
        }

        /* OCULTAR INFORMAÇÕES DE TESTE */

        #posicao,
        .ajuda-teclado {
            display: none;
        }


        
        /* MENU DE PAUSE */

        #menuPause {
            position: absolute;
            inset: 0;
            z-index: 20;

            background: rgba(2, 10, 30, 0.94);

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            gap: 16px;
        }

        #menuPause[hidden] {
            display: none;
        }

        #menuPause h2 {
            color: #7dd3fc;
            font-size: clamp(20px, 4cqw, 38px);
            text-shadow: 0 0 20px #0284c7;
            margin: 0 0 12px;
        }

        #menuPause button {
            width: min(50%, 280px);
            min-height: 42px;

            background: #123c72;
            color: white;

            border: 2px solid #38bdf8;
            border-radius: 12px;

            font-size: clamp(11px, 2cqw, 18px);
            font-weight: bold;

            cursor: pointer;
            touch-action: manipulation;
        }

        #menuPause button:active {
            background: #1674bc;
        }


        
        /* TELA DE ESCOLHA DO NOME */

        #telaEscolhaNome {
            position: absolute;
            inset: 0;
            z-index: 30;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            gap: clamp(8px, 2cqw, 18px);
            padding: 20px;

            background: rgba(2, 10, 30, 0.96);
            text-align: center;
        }

        #telaEscolhaNome[hidden] {
            display: none;
        }

        #telaEscolhaNome h2 {
            color: #7dd3fc;
            font-size: clamp(18px, 3.5cqw, 34px);
            margin: 0;
        }

        #telaEscolhaNome p {
            font-size: clamp(11px, 1.7cqw, 17px);
            margin: 0;
        }

        #inputNomeHeroi {
            width: min(75%, 320px);
            padding: 12px;

            border: 2px solid #38bdf8;
            border-radius: 10px;

            background: #071b3b;
            color: white;

            font-size: clamp(12px, 2cqw, 18px);
            text-align: center;
            outline: none;
        }

        #btnConfirmarNome {
            padding: 12px 25px;

            background: #123c72;
            color: white;

            border: 2px solid #38bdf8;
            border-radius: 10px;

            font-size: clamp(12px, 2cqw, 18px);
            font-weight: bold;
            cursor: pointer;
        }

        #erroNomeHeroi {
            color: #f87171;
        }


        /* TELA DE GAME OVER */

        #gameOver {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 10;

            background: rgba(4, 8, 20, 0.90);

            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 14px;
            text-align: center;
        }

        #gameOver.visivel {
            display: flex;
        }

        #gameOver h1 {
            margin: 0;
            color: #ef4444;
            font-size: clamp(30px, 7vw, 70px);
            text-shadow: 0 0 25px #dc2626;
            letter-spacing: 4px;
        }

        #gameOver p {
            margin: 0;
            color: #e2e8f0;
            font-size: clamp(12px, 2.5vw, 20px);
        }

        #reiniciar {
            width: auto;
            min-width: 150px;
            min-height: 45px;
            padding: 10px 20px;

            background: #15803d;
            border: 2px solid #4ade80;
            border-radius: 12px;

            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        #reiniciar:hover {
            background: #16a34a;
        }

        /* ADAPTAÇÃO PARA TELAS PEQUENAS */

        @media (max-width: 650px) {
            .controles {
                padding: 0 1.5%;
                gap: 4px;
            }

            .grupo {
                gap: 3px;
            }

            .hud {
                padding: 5px;
            }

            .barra {
                height: 8px;
            }

            #reiniciar {
                min-width: 140px;
                font-size: 12px;
            }
        }

        /* CELULARES EM MODO HORIZONTAL */

        @media (orientation: landscape)
               and (max-height: 500px) {
            .jogo {
                max-width: min(960px, 177.78vh);
            }

            .controles {
                bottom: 4%;
            }
        }
    </style>
</head>

<body>

    <div class="jogo">

        <!-- CENÁRIO DO JOGO -->

        <canvas
            id="canvas"
            width="960"
            height="540"
        ></canvas>

        
        <!-- BOTÃO DE PAUSE -->
        <button id="btnPause" type="button">
            ⏸ PAUSE
        </button>


        <!-- VIDA DO HERÓI -->

        <div class="hud">
            <strong>HERÓI</strong>

            <div class="barra">
                <div id="vidaPreenchimento"></div>
            </div>

            <span id="vidaTexto">
                100 / 100 HP
            </span>
        </div>


        <!-- MENU DE PAUSE -->
        <div id="menuPause" hidden>

            <h2>JOGO PAUSADO</h2>

            <button id="btnContinuarJogo" type="button">
                CONTINUAR JOGO
            </button>

            <button id="btnVoltarMenu" type="button">
                VOLTAR AO MENU
            </button>

        </div>


        
        <!-- TELA DE ESCOLHA DO NOME -->
        <div id="telaEscolhaNome" hidden>
            <h2>QUAL É O SEU NOME, HERÓI?</h2>

            <p>Como devemos chamar você nesta aventura?</p>

            <input
                type="text"
                id="inputNomeHeroi"
                placeholder="Digite seu nome"
                maxlength="20"
                autocomplete="off"
            >

            <button id="btnConfirmarNome" type="button">
                CONFIRMAR NOME
            </button>

            <p id="erroNomeHeroi" hidden>
                Digite um nome para continuar!
            </p>
        </div>


        <!-- GAME OVER -->

        <div id="gameOver">
            <h1>GAME OVER</h1>

            <p>O herói foi derrotado!</p>

            <button id="reiniciar">
                TENTAR NOVAMENTE
            </button>
        </div>

        <!-- CONTROLES SOBRE O CENÁRIO -->

        <div class="controles">

            <!-- CONTROLES DE MOVIMENTO -->

            <div class="grupo">
                <button id="esquerda">◀</button>
                <button id="direita">▶</button>
                
                
            </div>

            <!-- CONTROLES DE COMBATE -->

            <div class="grupo">
                <button id="pular">PULO</button>
                <button id="ataque1">ATQ 1</button>
                <button id="ataque2">ATQ 2</button>
            </div>

        </div>

    </div>

    <!-- INFORMAÇÕES DE DIAGNÓSTICO -->

    <p class="ajuda-teclado">
        A/D: mover | W/S: escadas |
        Espaço: pular | J/K: atacar
    </p>

    <p id="posicao"></p>

    <!-- MANTER TODOS OS SCRIPTS ORIGINAIS ABAIXO -->

  <script src="js/mundo1.js"></script>
  <script src="js/jogador.js"></script>
  <script src="js/animacoes.js"></script>
  <script src="js/combate.js"></script>
  <script src="js/inimigos.js"></script>
  <script src="js/chefao_raio_de_fogo.js"></script>
  <script src="js/cutscenes.js"></script>
  <script src="js/projeteis.js"></script>
  <!-- SISTEMA DE CHECKPOINTS -->
  <script src="js/salvamento.js"></script>


  <script>
    const canvas =
      document.getElementById("canvas");

    const ctx = canvas.getContext("2d");

    const teclas = {};

    
    /* =====================================
       MÚSICA DA FASE 1
    ===================================== */

    const musicaFase = new Audio("audio/musica_abertura.mp3");

    musicaFase.loop = true;
    musicaFase.volume = 0.5;

    function iniciarMusicaFase() {
        musicaFase.play().catch(erro => {
            console.log("Áudio aguardando interação:", erro);
        });
    }


    
    /* SISTEMA DE PAUSE */

    let jogoPausado = false;

    const btnPause = document.getElementById("btnPause");
    const menuPause = document.getElementById("menuPause");
    const btnContinuarJogo = document.getElementById("btnContinuarJogo");
    const btnVoltarMenu = document.getElementById("btnVoltarMenu");

    function alterarPausa(pausar) {
        if (gameOver) return;

        jogoPausado = pausar;
        menuPause.hidden = !pausar;

        // Soltar todos os controles pressionados
        Object.keys(teclas).forEach(
            tecla => teclas[tecla] = false
        );
    }
    
    btnPause.addEventListener("click", () => {
        if (aguardandoNome) return;
        alterarPausa(true);
    });


    btnContinuarJogo.addEventListener("click", () => {
        ultimoFrame = performance.now();
        alterarPausa(false);
    });

    btnVoltarMenu.addEventListener("click", () => {
        window.location.href = "index.html";
    });


    
    /* =====================================
      IDENTIFICAR PARTIDA SALVA
    ===================================== */

    const parametrosJogo =
      new URLSearchParams(window.location.search);

    const continuarPartida =
      parametrosJogo.get("continuar") === "1";

    const progressoSalvo =
      continuarPartida ? Salvamento.carregar() : null;

      
    /* SISTEMA DE NOME DO HERÓI */

    const telaEscolhaNome =
        document.getElementById("telaEscolhaNome");

    const inputNomeHeroi =
        document.getElementById("inputNomeHeroi");

    const btnConfirmarNome =
        document.getElementById("btnConfirmarNome");

    const erroNomeHeroi =
        document.getElementById("erroNomeHeroi");

    // Recuperar o nome de uma partida salva
    let nomeHeroi = progressoSalvo?.nomeHeroi || "";

    
    // Disponibilizar o nome para as cutscenes
    window.nomeHeroiPersonalizado = nomeHeroi || "HERÓI";


    // Impedir que o jogo comece antes da escolha
    let aguardandoNome = !progressoSalvo;

    if (aguardandoNome) {

      telaEscolhaNome.hidden = false;
    }


    console.log(
      "Modo de jogo:",
      progressoSalvo ? "CONTINUAR" : "NOVA PARTIDA"
    );


    
    let cameraX = progressoSalvo
      ? Math.max(
          0,
          Math.min(
            Mundo1.largura - canvas.width,
            progressoSalvo.checkpointX - canvas.width * 0.35
          )
        )
      : 0;

    let cameraY = 560;

    let ultimoFrame = performance.now();

    let fireballDisparada = false;
    
    let ultimoGolpeNoChefao = null;

    let ultimoGolpeDiagnosticado = null;


    // Estado da partida.
    let gameOver = false;
    let tempoMorte = 0;

    const DURACAO_MORTE = 1200;

    const vidaHeroi = {
      valor: 100,
      maxima: 100,
      tempoDano: 0
    };

    
    /* =====================================
      CHOQUE NO SISTEMA REMAKE
      DADOS DO CHECKPOINT
    ===================================== */

    function coletarDadosCheckpoint() {

      return {

        // Mundo atual
        mundo: 1,
        nomeHeroi: nomeHeroi,

        // Posição do herói
        checkpointX: Jogador.x,
        checkpointY: Jogador.y,

        // Vida do herói
        vida: vidaHeroi.valor,

        // Saqueadores derrotados
        
        saqueadoresDerrotados: Inimigos.lista
          .filter(npc => npc.derrotaContabilizada === true)
          .map(npc => npc.id),

        // Progresso das regiões
        avenidaConcluida:
          Inimigos.avenidaCentralConcluida(),

        distritoConcluido:
          Inimigos.distritoComercialConcluido(),

        industrialConcluido:
          Inimigos.bairroIndustrialConcluido(),

        // Situação do primeiro chefão
        raioDeFogoDerrotado:
          RaioDeFogo.derrotado === true

      };

    }

    
    /* =====================================
      CONTROLE DOS CHECKPOINTS
    ===================================== */

    // Identificar o último checkpoint salvo
    let ultimoCheckpoint = progressoSalvo
      ? (progressoSalvo.checkpointNumero || 0)
      : 0;

    // Registrar um novo checkpoint
    function registrarCheckpoint(numero) {

      // Evitar salvar novamente o mesmo checkpoint
      if (numero <= ultimoCheckpoint) {
        return;
      }

      const dados = coletarDadosCheckpoint();

      dados.checkpointNumero = numero;

      const salvou = Salvamento.salvar(dados);

      if (salvou) {
        ultimoCheckpoint = numero;

        console.log(
          "CHECKPOINT " + numero + " SALVO!"
        );
      }
    }



    const telaGameOver =
      document.getElementById("gameOver");

    const botaoReiniciar =
      document.getElementById("reiniciar");

    const preenchimento =
      document.getElementById("vidaPreenchimento");

    const textoVida =
      document.getElementById("vidaTexto");

    const textoPosicao =
      document.getElementById("posicao");

    // Inicializacao.
    AnimacoesHeroi.iniciar();
    Inimigos.iniciar();
    
    /* =====================================
      RESTAURAR HERÓI DO CHECKPOINT
    ===================================== */

    if (progressoSalvo) {

      // Recuperar posição
      Jogador.x = progressoSalvo.checkpointX;
      Jogador.y = progressoSalvo.checkpointY;

      // Recuperar vida
      if (Number.isFinite(progressoSalvo.vida)) {
        vidaHeroi.valor = Math.max(
          1,
          Math.min(vidaHeroi.maxima, progressoSalvo.vida)
        );
      }

      // Reiniciar velocidade e movimento
      Jogador.vx = 0;
      Jogador.vy = 0;
      Jogador.tempoImpacto = 0;
      Jogador.velocidadeImpacto = 0;
      Jogador.subindoEscada = false;
      Jogador.escadaAtual = null;

      console.log(
        "HERÓI RESTAURADO:",
        Jogador.x,
        Jogador.y,
        vidaHeroi.valor
      );
    }

    
    /* =====================================
      RESTAURAR SAQUEADORES DERROTADOS
    ===================================== */

    if (progressoSalvo) {

      const idsDerrotados = new Set(
        Array.isArray(progressoSalvo.saqueadoresDerrotados)
          ? progressoSalvo.saqueadoresDerrotados
          : []
      );

      let totalRestaurado = 0;

      Inimigos.lista.forEach(npc => {

        if (!idsDerrotados.has(npc.id)) {
          return;
        }

        npc.vida = 0;
        npc.vivo = false;
        npc.derrotado = true;
        npc.derrotaContabilizada = true;
        npc.estado = "death";
        npc.liberado = true;

        totalRestaurado++;
      });

      // Restaurar a contagem utilizada para liberar
      // progressivamente os próximos Saqueadores.
      Inimigos.totalDerrotados = totalRestaurado;

      Inimigos.atualizarLiberacao();

      console.log(
        "SAQUEADORES RESTAURADOS:",
        totalRestaurado
      );
    }

    
    /* =====================================
      INICIALIZAÇÃO DAS CUTSCENES
    ===================================== */

    if (!progressoSalvo) {

      // NOVA PARTIDA
      // A cutscene será iniciada após confirmar o nome.
      

    } else {

      // CONTINUAR PARTIDA

      
      // Iniciar a música ao continuar a partida
      iniciarMusicaFase();

      // Caso o navegador bloqueie o áudio,
      // iniciar após a primeira interação do jogador
      document.addEventListener(
          "pointerdown",
          iniciarMusicaFase,
          { once: true }
      );

      document.addEventListener(
          "keydown",
          iniciarMusicaFase,
          { once: true }
      );


      Cutscenes.estado = "combate_saqueadores";
      Cutscenes.ativa = false;
      Cutscenes.tempo = 0;
      Cutscenes.dialogoAtual = 0;

      
      /* =====================================
        RESTAURAR ESTADO DO RAIO DE FOGO
      ===================================== */

      RaioDeFogo.carregarSprites();

      RaioDeFogo.x = 4200;
      RaioDeFogo.y = 870;
      RaioDeFogo.vida = RaioDeFogo.vidaMaxima;

      RaioDeFogo.ativo = false;
      RaioDeFogo.derrotado = false;
      RaioDeFogo.estado = "aguardando";

      
      /* =====================================
        PREPARAR RETORNO CINEMATOGRÁFICO
      ===================================== */

      Cutscenes.retornoRaioPreparado = false;
      Cutscenes.raioChegou = false;

      RaioDeFogo.frame = 0;
      RaioDeFogo.tempoAnimacao = 0;
      RaioDeFogo.frameDerrota = 0;
      RaioDeFogo.tempoDerrota = 0;

      RaioDeFogo.animacaoDerrotaFinalizada = false;
      RaioDeFogo.cutsceneDerrotaIniciada = false;


      RaioDeFogo.atacando = false;
      RaioDeFogo.movendo = false;
      RaioDeFogo.heroiDetectado = false;
      RaioDeFogo.projeteis = [];

      if (progressoSalvo.raioDeFogoDerrotado === true) {

        RaioDeFogo.vida = 0;
        RaioDeFogo.derrotado = true;
        RaioDeFogo.estado = "derrota";
        RaioDeFogo.animacaoDerrotaFinalizada = true;
        RaioDeFogo.cutsceneDerrotaIniciada = true;

        console.log("RAIO DE FOGO JÁ DERROTADO!");

      } else {

        console.log("RAIO DE FOGO AGUARDANDO BATALHA!");

      }


      console.log(
        "CHECKPOINT CARREGADO — HERÓI LIBERADO!"
      );

    }




    const botoes = {
      esquerda: "ArrowLeft",
      direita: "ArrowRight",
      subir: "ArrowUp",
      descer: "ArrowDown",
      pular: "Space"
    };

    // Controles virtuais.
    document
      .querySelectorAll(".controles button")
      .forEach(botao => {

        const id = botao.id;

        if (
          id === "ataque1" ||
          id === "ataque2"
        ) {
          botao.addEventListener(
            "pointerdown",
            e => {
              e.preventDefault();

              if (
                vidaHeroi.valor <= 0 ||
                gameOver ||
                jogoPausado
              ) {
                return;
              }

              AnimacoesHeroi.iniciarAtaque(
                id === "ataque1"
                  ? "attack"
                  : "attack_02"
              );
            }
          );

          return;
        }

        const tecla = botoes[id];

        botao.addEventListener(
          "pointerdown",
          e => {
            e.preventDefault();

            if (
              vidaHeroi.valor <= 0 ||
              gameOver ||
              jogoPausado
            ) {
              return;
            }

            teclas[tecla] = true;
  
            botao.setPointerCapture(
              e.pointerId
            );
          }
        );

        const soltar = () => {
          teclas[tecla] = false;
        };

        botao.addEventListener(
          "pointerup",
          soltar
        );

        botao.addEventListener(
          "pointercancel",
          soltar
        );

        botao.addEventListener(
          "lostpointercapture",
          soltar
        );
      });

    // Teclado.
    window.addEventListener(
      "keydown",
      e => {

        if ([
          "ArrowLeft",
          "ArrowRight",
          "ArrowUp",
          "ArrowDown",
          "Space"
        ].includes(e.code)) {
          e.preventDefault();
        }

        if (
          vidaHeroi.valor <= 0 ||
          gameOver
        ) {
          return;
        }

        teclas[e.code] = true;

        if (e.key.length === 1) {
          teclas[e.key.toLowerCase()] = true;
        }

        if (
          !e.repeat &&
          e.code === "KeyJ"
        ) {
          AnimacoesHeroi.iniciarAtaque(
            "attack"
          );
        }

        if (
          !e.repeat &&
          e.code === "KeyK"
        ) {
          AnimacoesHeroi.iniciarAtaque(
            "attack_02"
          );
        }
      }
    );

    window.addEventListener(
      "keyup",
      e => {

        teclas[e.code] = false;

        if (e.key.length === 1) {
          teclas[e.key.toLowerCase()] = false;
        }
      }
    );

    window.addEventListener(
      "blur",
      () => {
        Object.keys(teclas).forEach(
          k => teclas[k] = false
        );
      }
    );

        // CONTROLE DOS DIÁLOGOS
    canvas.addEventListener("pointerdown", (evento) => {


      
      if (jogoPausado) return;


        console.log("Canvas recebeu clique!");

        if (
            Cutscenes.estado === "dialogo_intro" ||
            Cutscenes.estado === "dialogo_saqueador" ||
            Cutscenes.estado === "dialogo_retorno_raio" ||
            Cutscenes.estado === "dialogo_derrota_raio"
        ) {
            console.log(
                "Avançando diálogo:",
                Cutscenes.estado,
                Cutscenes.dialogoAtual
            );

            Cutscenes.avancarDialogo();
        }

    });


    /* CONFIRMAR NOME DO HERÓI */

    btnConfirmarNome.addEventListener("click", () => {

        const nomeDigitado = inputNomeHeroi.value.trim();

        if (!nomeDigitado) {
            erroNomeHeroi.hidden = false;
            return;
        }

        nomeHeroi = nomeDigitado;

        
        // Atualizar o nome exibido nos diálogos
        window.nomeHeroiPersonalizado = nomeHeroi;

        aguardandoNome = false;

        
        // Atualizar o nome em um checkpoint já existente
        const saveExistente = Salvamento.carregar();

        if (saveExistente) {
            Salvamento.salvar({
                ...saveExistente,
                nomeHeroi: nomeHeroi
            });
        }


        erroNomeHeroi.hidden = true;
        telaEscolhaNome.hidden = true;

        // Limpar controles antes de iniciar
        Object.keys(teclas).forEach(
            tecla => teclas[tecla] = false
        );

        // Iniciar a primeira cutscene
        Cutscenes.iniciar("intro");
        Cutscenes.iniciarEntradaRaio();

        
        // Iniciar música da fase 1
        iniciarMusicaFase();


        console.log("NOME DO HERÓI:", nomeHeroi);
    });


    // Reiniciar partida.
    botaoReiniciar.addEventListener(
      "click",
      () => {
        window.location.reload();
      }
    );

    function mostrarGameOver() {
      if (gameOver) return;

      gameOver = true;

      telaGameOver.classList.add(
        "visivel"
      );

      Object.keys(teclas).forEach(
        k => teclas[k] = false
      );
    }

    
    function desenharVidaChefao() {

        if (
            Cutscenes.ativa ||
            !RaioDeFogo.ativo ||
            RaioDeFogo.derrotado
        ) {
            return;
        }

        const largura = 500;
        const altura = 20;
        const x = (canvas.width - largura) / 2;
        const y = 25;

        const percentual = Math.max(
            0,
            Math.min(1, RaioDeFogo.vida / RaioDeFogo.vidaMaxima)
        );

        ctx.save();

        ctx.textAlign = "center";
        ctx.font = "bold 22px Arial";
        ctx.fillStyle = "#ff9a3c";
        ctx.fillText("RAIO DE FOGO", canvas.width / 2, y - 5);

        // Fundo da barra
        ctx.fillStyle = "#252525";
        ctx.fillRect(x, y + 10, largura, altura);

        // Vida restante
        ctx.fillStyle = "#dc2626";
        ctx.fillRect(
            x,
            y + 10,
            largura * percentual,
            altura
        );

        // Borda
        ctx.strokeStyle = "#ff9a3c";
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y + 10, largura, altura);

        // Quantidade de vida
        ctx.font = "bold 14px Arial";
        ctx.fillStyle = "#ffffff";
        ctx.fillText(
            RaioDeFogo.vida + " / " + RaioDeFogo.vidaMaxima + " HP",
            canvas.width / 2,
            y + 25
        );

        ctx.restore();
}


    function atualizarHUD() {
      const percentual =
        (vidaHeroi.valor /
         vidaHeroi.maxima) * 100;

      preenchimento.style.width =
        percentual + "%";

      preenchimento.style.background =
        percentual > 50
          ? "#22c55e"
          : percentual > 25
            ? "#f59e0b"
            : "#ef4444";

      textoVida.textContent =
        vidaHeroi.valor +
        " / " +
        vidaHeroi.maxima +
        " HP";

      textoPosicao.textContent =
        "X: " + Math.round(Jogador.x) +
        " | Y: " + Math.round(Jogador.y) +
        " | NPCs vivos: " +
        Inimigos.contarVivos() +
        (
          AnimacoesHeroi.tipoAtaque === "attack" &&
          AnimacoesHeroi.comboEtapa > 0
            ? " | COMBO " + AnimacoesHeroi.comboEtapa + "/3"
            : AnimacoesHeroi.comboTempo > 0 &&
              AnimacoesHeroi.comboEtapa > 0
              ? " | COMBO " + AnimacoesHeroi.comboEtapa + "/3 — J para continuar"
              : ""
        ) +
        (
          vidaHeroi.valor <= 0
            ? " | HERÓI DERROTADO"
            : ""
        );
    }

    function desenharSocoEletrico() {
      const etapa = Math.max(1, Math.min(3, AnimacoesHeroi.comboEtapa || 1));
      const sentido = AnimacoesHeroi.direcao === -1 ? -1 : 1;
      const x = Jogador.x + Jogador.largura / 2 + sentido * 48 - cameraX;
      const y = Jogador.y + Jogador.altura - 110 + 14 + 110 * 0.38 - cameraY;
      const raio = etapa === 3 ? 29 : etapa === 2 ? 24 : 20;
      const cor = etapa === 3 ? "#c084fc" : etapa === 2 ? "#93c5fd" : "#7dd3fc";
      const brilhoCor = etapa === 3
        ? "rgba(168,85,247,0.7)"
        : "rgba(56,189,248,0.7)";

      ctx.save();
      ctx.globalCompositeOperation = "lighter";
      const brilho = ctx.createRadialGradient(x, y, 0, x, y, raio);
      brilho.addColorStop(0, "rgba(255,255,255,0.9)");
      brilho.addColorStop(0.35, brilhoCor);
      brilho.addColorStop(1, "rgba(56,189,248,0)");
      ctx.fillStyle = brilho;
      ctx.beginPath();
      ctx.arc(x, y, raio, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = cor;
      ctx.lineWidth = etapa === 3 ? 3 : 2;
      const quantidade = etapa === 3 ? 11 : etapa === 2 ? 8 : 5;
      for (let i = 0; i < quantidade; i++) {
        const a = performance.now() / 95 + i * Math.PI * 2 / quantidade;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a) * 8, y + Math.sin(a) * 8);
        ctx.lineTo(x + Math.cos(a) * (raio - 4), y + Math.sin(a) * (raio - 4));
        ctx.stroke();
      }
      ctx.restore();
    }

    function atualizar() {


      
      // CONGELAR A PARTIDA DURANTE O PAUSE
      if (jogoPausado || aguardandoNome) {
          ultimoFrame = performance.now();
          requestAnimationFrame(atualizar);
          return;
      }


      
      // OCULTAR CONTROLES DURANTE AS CUTSCENES
      const controlesTela = document.querySelector(".controles");

      if (Cutscenes.ativa) {
          controlesTela.classList.add("ocultos");
      } else {
          controlesTela.classList.remove("ocultos");
      }


      const agora = performance.now();

      const dt = Math.min(
        agora - ultimoFrame,
        50
      );

      ultimoFrame = agora;

      if (
        Cutscenes.ativa && Cutscenes.estado === "intro"
      ){
        Cutscenes.atualizarEntradaRaio(dt);
      }

      if (Cutscenes.ativa && Cutscenes.estado === "fuga_raio"){
        Cutscenes.atualizarFugaRaio(dt);
      }

      // ENTRADA CINEMATOGRÁFICA DO SAQUEADOR
      if(Cutscenes.ativa && Cutscenes.estado === "entrada_saqueador"){
        Cutscenes.atualizarEntradaSaqueador(dt);
      }

      
      // ==========================================
      // RETORNO CINEMATOGRÁFICO DO RAIO DE FOGO
      // ==========================================

      if (
          Cutscenes.ativa &&
          Cutscenes.estado === "retorno_raio"
      ) {
          Cutscenes.atualizarRetornoRaio(dt);
      }


      // Invencibilidade temporaria.
      vidaHeroi.tempoDano = Math.max(
        0,
        vidaHeroi.tempoDano - dt
      );

      // Movimentacao somente enquanto vivo.
      if (
        vidaHeroi.valor > 0 &&
        !gameOver
      ) {
        Jogador.atualizar(
          teclas,
          Mundo1.obterPlataformas()
        );
      }

      // ==========================================
      // CAMERA COM PROGRESSAO POR CENARIO
      // ==========================================

      // Verificar se os Saqueadores da Avenida
      // Central foram derrotados.
      const avenidaConcluida =
        Inimigos.avenidaCentralConcluida();

      
      /* =====================================
        CHECKPOINT 1 — AVENIDA CENTRAL
      ===================================== */

      if (
        avenidaConcluida &&
        !Cutscenes.ativa &&
        vidaHeroi.valor > 0 &&
        !gameOver
      ) {
        registrarCheckpoint(1);
      }
  

      // Centro do heroi na tela.
      const alvoX =
        Jogador.x +
        Jogador.largura / 2 -
        canvas.width / 2;

      const alvoY =
        Jogador.y +
        Jogador.altura / 2 -
        canvas.height / 2;

      // ==========================================
      // PROGRESSÃO DA CÂMERA — MUNDO 1
      // ==========================================

      const distritoConcluido =
        Inimigos.distritoComercialConcluido();

        
      /* =====================================
        CHECKPOINT 2 — DISTRITO COMERCIAL
      ===================================== */

      if (
        avenidaConcluida &&
        distritoConcluido &&
        !Cutscenes.ativa &&
        vidaHeroi.valor > 0 &&
        !gameOver
      ) {
        registrarCheckpoint(2);
      }


      const industrialConcluido =
        Inimigos.bairroIndustrialConcluido();
        
      
      /* =====================================
        CHECKPOINT 3 — BAIRRO INDUSTRIAL
      ===================================== */

      if (
        avenidaConcluida &&
        distritoConcluido &&
        industrialConcluido &&
        !Cutscenes.ativa &&
        vidaHeroi.valor > 0 &&
        !gameOver
      ) {
        registrarCheckpoint(3);
      }

      /* =====================================
        CHECKPOINT 4 — USINA ELÉTRICA
      ===================================== */

      if (
        avenidaConcluida &&
        distritoConcluido &&
        industrialConcluido &&
        RaioDeFogo.derrotado === true &&
        !Cutscenes.ativa &&
        vidaHeroi.valor > 0 &&
        !gameOver
      ) {
        registrarCheckpoint(4);
      }



      // Inicialmente, apenas a Avenida Central
      let limiteRegiao = 1200;

      // Liberar Distrito Comercial
      if (avenidaConcluida) {
        limiteRegiao = 2400;
      }

      // Liberar Bairro Industrial
      if (avenidaConcluida && distritoConcluido) {
        limiteRegiao = 3600;
      }

      // Liberar Usina Elétrica
      if (
        avenidaConcluida &&
        distritoConcluido &&
        industrialConcluido
      ) {
        limiteRegiao = Mundo1.largura;
      }

      // Limite máximo da câmera
      const limiteCameraX = Math.max(
        0,
        limiteRegiao - canvas.width
      );              

      // Impedir que a camera avance para
      // o Distrito Comercial antes da hora.
      const alvoXLimitado = Math.max(
        0,
        Math.min(limiteCameraX, alvoX)
      );

      // Movimento suave da camera.
      cameraX +=
        (alvoXLimitado - cameraX) * 0.08;

      cameraY +=
        (alvoY - cameraY) * 0.08;

      // Garantir que a camera respeite
      // os limites do cenario liberado.
      cameraX = Math.max(
        0,
        Math.min(limiteCameraX, cameraX)
      );

      // Limites verticais.
      cameraY = Math.max(
        0,
        Math.min(
          Mundo1.altura - canvas.height,
          cameraY
        )
      );

      // Cenario.
      Mundo1.desenhar(
        ctx,
        cameraX,
        cameraY
      );

      if (Mundo1.desenharEscadas) {
        Mundo1.desenharEscadas(
          ctx,
          cameraX,
          cameraY
        );
      }

      // Animacoes continuam mesmo
      // depois da morte do heroi.
      AnimacoesHeroi.atualizar(
        Jogador,
        dt
      );

      // Cada animacao attack_02 dispara
      // somente uma Fireball.
      if (!AnimacoesHeroi.atacando) {
        fireballDisparada = false;
      }

      if (
        vidaHeroi.valor > 0 &&
        !gameOver &&
        AnimacoesHeroi.atacando &&
        AnimacoesHeroi.tipoAtaque === "attack_02" &&
        AnimacoesHeroi.frame >= 4 &&
        !fireballDisparada
      ) {
        Projeteis.disparar(
          Jogador,
          AnimacoesHeroi.direcao
        );

        fireballDisparada = true;
      }

      // Hitbox apenas do soco.
      const hitboxAtaque =
        vidaHeroi.valor > 0 &&
        !gameOver &&
        AnimacoesHeroi.tipoAtaque === "attack"
          ? Combate.obterHitbox(
              Jogador,
              AnimacoesHeroi
            )
          : null;

      // IA do Saqueador.
      if (!gameOver) {
        if (!Cutscenes.ativa){
          Inimigos.atualizar(
            dt,
            Jogador,
            vidaHeroi
          );
        }

        

       
        /* =====================================
          INICIAR BATALHA FINAL
        ===================================== */

        if (
          !Cutscenes.ativa &&
          !RaioDeFogo.ativo &&
          !RaioDeFogo.derrotado &&
          Inimigos.podeIniciarChefao()
        ) {

          // Reiniciar o controle da entrada cinematográfica
          Cutscenes.retornoRaioPreparado = false;

          // Preparar o chefão para a batalha
          RaioDeFogo.iniciar();

          // Iniciar a cena de retorno
          Cutscenes.iniciar("retorno_raio");

          console.log(
            "CUTSCENE DO RETORNO DO RAIO DE FOGO INICIADA!"
          );
        }


        // Atualizar o chefão
        if (!Cutscenes.ativa){
          RaioDeFogo.atualizar(
            dt,
            Jogador,
            vidaHeroi
          );
        }


        // Soco: hitbox curta.
        // Fireball: colisao independente.
        if (vidaHeroi.valor > 0) {
          Inimigos.receberAtaque(
            hitboxAtaque,
            AnimacoesHeroi.idGolpe
          );

          
          // ==========================================
          // SOCO ELÉTRICO CONTRA O RAIO DE FOGO
          // ==========================================

          if (
              !Cutscenes.ativa &&
              RaioDeFogo.ativo &&
              !RaioDeFogo.derrotado &&
              hitboxAtaque
          ) {
              const colisaoChefao =
                  hitboxAtaque.x < RaioDeFogo.x + RaioDeFogo.largura &&
                  hitboxAtaque.x + hitboxAtaque.w > RaioDeFogo.x &&
                  hitboxAtaque.y < RaioDeFogo.y + RaioDeFogo.altura &&
                  hitboxAtaque.y + hitboxAtaque.h > RaioDeFogo.y;

                  
                  if (AnimacoesHeroi.idGolpe !== ultimoGolpeDiagnosticado) {
                      ultimoGolpeDiagnosticado = AnimacoesHeroi.idGolpe;

                    

                    console.log(
                        "PROPRIEDADES REAIS DA HITBOX:",
                        JSON.stringify(hitboxAtaque)
                    );

                      
                    console.log("DIAGNÓSTICO DO SOCO:", {
                        golpe: AnimacoesHeroi.idGolpe,
                        colisao: colisaoChefao,

                        socoX: hitboxAtaque.x,
                        socoY: hitboxAtaque.y,
                        socoLargura: hitboxAtaque.largura,
                        socoAltura: hitboxAtaque.altura,

                        heroiX: Jogador.x,
                        heroiY: Jogador.y,

                        chefaoX: RaioDeFogo.x,
                        chefaoY: RaioDeFogo.y,
                        chefaoLargura: RaioDeFogo.largura,
                        chefaoAltura: RaioDeFogo.altura
                    });

                  }


              
              if (
                  colisaoChefao &&
                  AnimacoesHeroi.idGolpe !== ultimoGolpeNoChefao
              ) {
                  RaioDeFogo.receberDano(10);

                  ultimoGolpeNoChefao = AnimacoesHeroi.idGolpe;

                  console.log(
                      "SOCO ELÉTRICO ACERTOU O CHEFÃO!",
                      "Golpe:", AnimacoesHeroi.idGolpe,
                      "Vida restante:", RaioDeFogo.vida
                  );
              }

          }


          Projeteis.atualizar(
            dt,
            Inimigos
          );
        }
      }

      // Detectar derrota.
      if (
        vidaHeroi.valor <= 0 &&
        !gameOver
      ) {
        if (!AnimacoesHeroi.morrendo) {
          AnimacoesHeroi.iniciarMorte();
        }

        tempoMorte += dt;

        if (
          tempoMorte >= DURACAO_MORTE
        ) {
          mostrarGameOver();
        }
      }

      // Desenhar inimigos.
      if(!Cutscenes.ativa || Cutscenes.estado === "entrada_saqueador" || Cutscenes.estado === "dialogo_saqueador"){
        Inimigos.desenhar(        
          ctx,
          cameraX,
          cameraY
        );
      }
      

      // ==========================================
      // DESENHAR CHEFÃO — RAIO DE FOGO
      // ==========================================

      RaioDeFogo.desenhar(
        ctx,
        cameraX,
        cameraY
      );

      // Desenhar os projéteis do chefão
      RaioDeFogo.desenharProjeteis(
        ctx,
        cameraX,
        cameraY
      );

      
      
      desenharVidaChefao();

      

      // Efeito visual de invencibilidade.
      const piscar =
        vidaHeroi.valor > 0 &&
        vidaHeroi.tempoDano > 0 &&
        Math.floor(
          vidaHeroi.tempoDano / 70
        ) % 2 === 0;

      if (!piscar) {
        const desenhou =
          AnimacoesHeroi.desenhar(
            ctx,
            Jogador,
            cameraX,
            cameraY
          );

        if (!desenhou) {
          Jogador.desenhar(
            ctx,
            cameraX,
            cameraY
          );
        }
      }

      // Hitbox de teste.
      if (hitboxAtaque) {
        Combate.desenharHitbox(
          ctx,
          hitboxAtaque,
          cameraX,
          cameraY
        );
      }


      // Fireball na posicao real do mundo.
      Projeteis.desenhar(
        ctx,
        cameraX,
        cameraY
      );

      // Desenhar dialogo
      Cutscenes.desenharDialogo(ctx);

      atualizarHUD();

      requestAnimationFrame(
        atualizar
      );
    }

    atualizar();
  </script>
