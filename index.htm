
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Alencar Game Studio Apresenta</title>

    <style>
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .apresentacao {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: desaparecer 1.5s ease-in 5.5s forwards;
        }

        /* LOGO APARECE PRIMEIRO */
        .logo {
            width: min(65vw, 420px);
            height: auto;
            object-fit: contain;

            opacity: 0;
            animation: surgirLogo 2s ease-in-out forwards;
        }

        /* APRESENTA APARECE DEPOIS */
        .texto {
            margin-top: 24px;
            color: white;
            font-size: clamp(18px, 3vw, 28px);
            font-weight: bold;
            letter-spacing: 8px;
            text-align: center;

            opacity: 0;
            animation: surgirTexto 2s ease-in-out 3s forwards;
        }

        /* ENTRADA SUAVE DA LOGO */
        @keyframes surgirLogo {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ENTRADA SUAVE DO APRESENTA */
        @keyframes surgirTexto {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* SAÍDA SUAVE DOS DOIS */
        @keyframes desaparecer {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

    </style>
</head>

<body>

    <div class="apresentacao">
        <img
            src="logo_alencar.png"
            class="logo"
            alt="Alencar Game Studio"
        >

        <div class="texto">
            APRESENTA
        </div>
    </div>

    <script>
        // Após 5 segundos, iniciar a abertura
        setTimeout(function () {
            window.location.replace(
                "abertura/index.html"
            );
        }, 7000);
    </script>

</body>
</html>
