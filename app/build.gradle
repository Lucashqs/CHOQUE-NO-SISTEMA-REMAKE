
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alencargamestudio.choquenosistemaremake'
    compileSdk 35

    defaultConfig {
        applicationId "com.alencargamestudio.choquenosistemaremake"

        minSdk 23
        targetSdk 35

        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
