
name: Choque no Sistema Remake - Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Preparar arquivos do jogo
        run: |
          mkdir -p app/src/main/assets

          cp teste_mundo1.html app/src/main/assets/

          for pasta in imagens js sons sprites; do
            if [ -d "$pasta" ]; then
              cp -R "$pasta" app/src/main/assets/
            fi
          done

          test -f app/src/main/assets/teste_mundo1.html

      - name: Compilar APK Debug
        run: gradle --no-daemon :app:assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Choque-no-Sistema-Remake-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
