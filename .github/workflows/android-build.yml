
name: Compilador APK e AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  compilar:
    name: Compilador APK e AAB
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # BAIXAR PROJETO
      - name: Baixar código
        uses: actions/checkout@v4

      # CONFIGURAR JAVA
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # CONFIGURAR GRADLE
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # PREPARAR TODOS OS ARQUIVOS
      - name: Preparar arquivos do jogo
        shell: bash
        run: |
          set -e

          echo "Preparando Choque no Sistema REMAKE..."

          DESTINO="app/src/main/assets"

          mkdir -p "$DESTINO"

          # APRESENTAÇÃO DO ESTÚDIO
          cp index.htm "$DESTINO/index.htm"
          cp logo_alencar.png "$DESTINO/"

          # ABERTURA CINEMATOGRÁFICA
          mkdir -p "$DESTINO/abertura"
          cp -R abertura/. "$DESTINO/abertura/"

          # MENU PRINCIPAL E MUNDO 1
          mkdir -p "$DESTINO/assets"
          cp -R assets/. "$DESTINO/assets/"

          # VERIFICAR ARQUIVOS
          test -f "$DESTINO/index.htm"
          test -f "$DESTINO/abertura/index.html"
          test -f "$DESTINO/abertura/abertura.js"
          test -f "$DESTINO/assets/index.html"
          test -f "$DESTINO/assets/teste_mundo1.html"

          echo "Arquivos preparados com sucesso!"

          find "$DESTINO" -maxdepth 3 -type f

      # COMPILAR APK DE TESTE
      - name: Compilar APK Debug
        run: |
          gradle --no-daemon :app:assembleDebug

      # RESTAURAR ASSINATURA
      - name: Restaurar keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64"

          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode > release.jks

          test -s release.jks

          echo "Keystore restaurada com sucesso!"

      # COMPILAR APK E AAB ASSINADOS
      - name: Compilar APK e AAB Release
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          gradle --no-daemon \
            :app:assembleRelease \
            :app:bundleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # PUBLICAR APK DEBUG
      - name: Publicar APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: Choque-REMAKE-APK-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # PUBLICAR APK RELEASE
      - name: Publicar APK Release
        uses: actions/upload-artifact@v4
        with:
          name: Choque-REMAKE-APK-Release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # PUBLICAR AAB RELEASE
      - name: Publicar AAB Release
        uses: actions/upload-artifact@v4
        with:
          name: Choque-REMAKE-AAB-Release
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      # REMOVER KEYSTORE TEMPORÁRIA
      - name: Limpar keystore
        if: always()
        run: |
          rm -f release.jks
